name: Build

on:
  push:
    branches: [main, test]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload assets to (e.g. 0.1.0)"
        required: true
        type: string

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x86_64
          - os: windows-latest
            platform: windows
            arch: x86_64
            ext: .exe

          # Linux x86_64
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            ext: ""

          # macOS ARM64 (Apple Silicon) - using macos-14 which supports ARM
          - os: macos-latest
            platform: macos
            arch: arm64
            ext: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Install ARM64 target
        if: matrix.arch == 'arm64'
        run: rustup target add aarch64-apple-darwin

      - name: Build (native)
        if: matrix.arch != 'arm64'
        run: cargo build --release --package mnem-cli --package mnem-daemon

      - name: Build (ARM64)
        if: matrix.arch == 'arm64'
        run: cargo build --release --package mnem-cli --package mnem-daemon --target aarch64-apple-darwin

      - name: Create archive
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cd target/release
            7z a ../../mnem-${{ matrix.platform }}-${{ matrix.arch }}.zip mnem${{ matrix.ext }} mnem-daemon${{ matrix.ext }}
            cd ../..
          elif [ "${{ matrix.arch }}" = "arm64" ]; then
            cd target/aarch64-apple-darwin/release
            zip -r ../../../mnem-${{ matrix.platform }}-${{ matrix.arch }}.zip mnem mnem-daemon
            cd ../../..
          else
            cd target/release
            zip -r ../../mnem-${{ matrix.platform }}-${{ matrix.arch }}.zip mnem mnem-daemon
            cd ../..
          fi
          ls -la mnem-*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mnem-${{ matrix.platform }}-${{ matrix.arch }}
          path: mnem-${{ matrix.platform }}-${{ matrix.arch }}.*

  release:
    needs: build
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract artifacts and prepare binaries
        run: |
          mkdir -p release
          mkdir -p temp_extract

          # Extract each artifact to its own subdirectory
          for zipfile in artifacts/mnem-*/*.zip; do
            if [ -f "$zipfile" ]; then
              # Get platform name from directory
              platform=$(echo "$zipfile" | grep -oP 'mnem-\K[^/]+')
              echo "Processing platform: $platform"

              # Create platform subdirectory
              platform_dir="temp_extract/$platform"
              mkdir -p "$platform_dir"

              # Extract to platform directory
              unzip -q -o "$zipfile" -d "$platform_dir"

              # Create platform-specific ZIP
              (cd "$platform_dir" && zip -qr "../../release/mnem-$platform.zip" *)
            fi
          done

          # Clean up temp directory
          rm -rf temp_extract

          # List what we have
          echo "Files prepared for release:"
          ls -lh release/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: release/*
          draft: false
