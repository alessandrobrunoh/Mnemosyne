name: Build

on:
  push:
    branches: [main, test]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload assets to (e.g. 0.1.0)"
        required: true
        type: string

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x86_64
          - os: windows-latest
            platform: windows
            arch: x86_64
            ext: .exe

          # Linux x86_64
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            ext: ""

          # macOS ARM64 (Apple Silicon)
          - os: macos-latest
            platform: macos
            arch: arm64
            ext: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Install ARM64 target
        if: matrix.arch == 'arm64'
        run: rustup target add aarch64-apple-darwin

      - name: Build (native)
        if: matrix.arch != 'arm64'
        run: cargo build --release --package mnem-cli --package mnem-daemon

      - name: Build (ARM64)
        if: matrix.arch == 'arm64'
        run: cargo build --release --package mnem-cli --package mnem-daemon --target aarch64-apple-darwin

      - name: Collect binaries
        shell: bash
        run: |
          mkdir -p dist

          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/release/mnem.exe dist/mnem.exe
            cp target/release/mnem-daemon.exe dist/mnem-daemon.exe
          elif [ "${{ matrix.arch }}" = "arm64" ]; then
            cp target/aarch64-apple-darwin/release/mnem dist/mnem
            cp target/aarch64-apple-darwin/release/mnem-daemon dist/mnem-daemon
          else
            cp target/release/mnem dist/mnem
            cp target/release/mnem-daemon dist/mnem-daemon
          fi

          echo "Binaries collected:"
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mnem-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  release:
    needs: [build, check]
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create platform ZIPs
        run: |
          mkdir -p release

          for platform_dir in artifacts/mnem-*/; do
            platform_name=$(basename "$platform_dir" | sed 's/^mnem-//')
            echo "Packaging platform: $platform_name"

            zip -qj "release/mnem-${platform_name}.zip" "$platform_dir"*

            echo "Created: mnem-${platform_name}.zip"
          done

          echo "Files prepared for release:"
          ls -lh release/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: release/*.zip
          draft: false
