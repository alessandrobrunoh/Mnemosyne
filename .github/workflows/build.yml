name: Build

on:
  push:
    branches: [main, test]
  release:
    types: [published]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x86_64
          - os: windows-latest
            platform: windows
            arch: x86_64
            ext: .exe

          # Linux x86_64
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            ext: ""

          # macOS ARM64 (Apple Silicon) - using macos-14 which supports ARM
          - os: macos-latest
            platform: macos
            arch: arm64
            ext: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Install ARM64 target
        if: matrix.arch == 'arm64'
        run: rustup target add aarch64-apple-darwin

      - name: Build (native)
        if: matrix.arch != 'arm64'
        run: cargo build --release --package mnem-cli --package mnem-daemon

      - name: Build (ARM64)
        if: matrix.arch == 'arm64'
        run: cargo build --release --package mnem-cli --package mnem-daemon --target aarch64-apple-darwin

      - name: Create archive
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cd target/release
            7z a ../../mnem-${{ matrix.platform }}-${{ matrix.arch }}.zip mnem${{ matrix.ext }} mnem-daemon${{ matrix.ext }}
            cd ../..
          elif [ "${{ matrix.arch }}" = "arm64" ]; then
            cd target/aarch64-apple-darwin/release
            zip -r ../../../mnem-${{ matrix.platform }}-${{ matrix.arch }}.zip mnem mnem-daemon
            cd ../../..
          else
            cd target/release
            zip -r ../../mnem-${{ matrix.platform }}-${{ matrix.arch }}.zip mnem mnem-daemon
            cd ../..
          fi
          ls -la mnem-*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mnem-${{ matrix.platform }}-${{ matrix.arch }}
          path: mnem-${{ matrix.platform }}-${{ matrix.arch }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract artifacts and prepare binaries
        run: |
          mkdir -p release

          # Find all ZIP files recursively in artifacts directory
          find artifacts -name "*.zip" -type f | while read zipfile; do
            echo "Found artifact: $zipfile"
            # Extract to release directory
            unzip -q -o "$zipfile" -d release/
          done

          # Move binaries from subdirectories to release root
          find release -mindepth 2 -type f -exec mv {} release/ \;

          # Remove empty subdirectories
          find release -mindepth 1 -type d -delete 2>/dev/null || true

          # List what we have
          echo "Files prepared for release:"
          ls -lh release/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          draft: false
